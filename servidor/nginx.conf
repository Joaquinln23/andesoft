# nginx: ejemplo de bloque server. Ajusta dominio, certificados y ruta.
# Si se agrega el endpoint del formulario, añádelo a connect-src.
server {
    listen 443 ssl http2;
    server_name www.andesoft.cl andesoft.cl;

    ssl_certificate     /etc/letsencrypt/live/andesoft.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andesoft.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/andesoft/public;     # SOLO la carpeta public/, nunca la raíz del proyecto
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Sitio estático: solo lectura
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    location ~ /\.(?!well-known) { deny all; }     # archivos ocultos
    location ~* \.(webp|png|svg|css|js)$ { expires 1d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}

server {                                           # HTTP → HTTPS
    listen 80;
    server_name www.andesoft.cl andesoft.cl;
    return 301 https://www.andesoft.cl$request_uri;
}
